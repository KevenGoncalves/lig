# Pushing a version tag builds lig and publishes a GitHub release:
#
#   git tag -a v1.0.4 -m "1.0.4" && git push origin v1.0.4
#
# Assets: glibc (2.35+) and static musl archives for x86_64/aarch64, deb and
# rpm packages of the musl builds, an Apple Silicon macOS archive, checksums,
# and install.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.0.3"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test macOS
        if: runner.os == 'macOS'
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary runs
        run: target/${{ matrix.target }}/release/lig --version
      - name: Package
        run: |
          name="lig-${TAG#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/lig README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # A token that can push to <owner>/homebrew-tap; without it the tap isn't updated.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The private SSH key of the AUR account that maintains lig-bin; without it the AUR isn't updated.
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      # The Copr package's custom webhook URL; without it Copr isn't rebuilt.
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      # The armored secret key that signs the APT repository; without it the repository isn't published.
      APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
    outputs:
      apt: ${{ steps.publish.outcome == 'success' && env.APT_GPG_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Build deb and rpm packages from the static Linux builds
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          nfpm="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$nfpm" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$nfpm"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$nfpm" | sha256sum -c
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$nfpm" nfpm
          export VERSION="${TAG#v}"
          for arch in x86_64:amd64 aarch64:arm64; do
            name="lig-$VERSION-${arch%%:*}-unknown-linux-musl"
            tar -C "$RUNNER_TEMP" -xzf "dist/$name.tar.gz"
            install -D "$RUNNER_TEMP/$name/lig" source/target/nfpm/lig
            for packager in deb rpm; do
              (cd source && ARCH="${arch#*:}" "$RUNNER_TEMP/nfpm" package -f packaging/nfpm.yaml -p "$packager" -t ../dist/)
            done
          done
          cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
      - name: Add the install script, with this release's version
        # Same name in every release, so releases/latest/download/install.sh works.
        run: sed "s/@VERSION@/${TAG#v}/" source/install.sh > dist/install.sh
      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: drop assets this build didn't produce, replace the rest.
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Update the Homebrew tap
        # Each channel runs even if another failed, once the release is out.
        if: always() && steps.publish.outcome == 'success' && env.HOMEBREW_TAP_TOKEN != ''
        run: |
          version="${TAG#v}"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          sh source/packaging/homebrew/formula.sh "$version" dist > "$tap/Formula/lig.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lig.rb
          git diff --cached --quiet || { git commit -m "lig $version" && git push; }
      - name: Update the AUR package
        if: always() && steps.publish.outcome == 'success' && env.AUR_SSH_KEY != ''
        run: |
          version="${TAG#v}"
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The ED25519 host key fingerprint published on aur.archlinux.org.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          aur="$RUNNER_TEMP/lig-bin"
          git clone ssh://aur@aur.archlinux.org/lig-bin.git "$aur"
          sh source/packaging/aur/aur.sh "$version" dist "$aur"
          cd "$aur"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO lig.install
          git diff --cached --quiet || { git commit -m "lig $version" && git push origin HEAD:master; }
      - name: Rebuild the Copr package
        if: always() && steps.publish.outcome == 'success' && env.COPR_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$COPR_WEBHOOK_URL"

  # The APT repository on GitHub Pages (Settings → Pages → Source: GitHub Actions), rebuilt
  # from this release's .deb files.
  apt:
    needs: release
    if: always() && needs.release.outputs.apt == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build the signed repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          gh release download "$TAG" --pattern '*.deb' --dir "$RUNNER_TEMP/debs"
          printf '%s\n' "$APT_GPG_KEY" | gpg --batch --import
          sh packaging/apt/repo.sh "$RUNNER_TEMP/debs" site/apt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
