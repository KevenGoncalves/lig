[package]
name = "lig-windows-e2e"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, so lig's workspace doesn't claim it.
[workspace]

[dependencies]
anyhow = "1.0.104"
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
