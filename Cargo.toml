[package]
name = "lig"
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Keven Gonçalves"]
description = "IDE-style autocomplete for your terminal on macOS, Linux and Windows"
license = "MIT"
repository = "https://github.com/KevenGoncalves/lig"

[workspace]
members = [".", "tools/figconv"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
flate2 = "1"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term", "ioctl", "signal", "process", "fs"] }
portable-pty = "0.9.0"
signal-hook = "0.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[build-dependencies]
flate2 = "1"
serde_json = "1"

# Compressing the spec archive is slow in an unoptimized build script.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
